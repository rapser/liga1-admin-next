# Automatiza la sincronización con el proveedor de datos en vivo.
#
# Antes esto dependía de correr `npm run monitor:live -- <eventId>` a mano
# por cada partido. Este workflow reemplaza ese paso manual llamando
# POST /api/live-sync sin `eventId`. El backend solo incorpora partidos desde
# cinco minutos antes de su inicio hasta su cierre; no consulta todo el fixture
# cada cinco minutos.
#
# Cadencia recomendada en src/data/providers/README.md:
#   - mode=live: cada minuto (GitHub Actions solo permite 5 min como mínimo).
#   - mode=fixtures: cada 6 horas.
#   - mode=reconcile: una vez de madrugada.
#
# Requiere los mismos secrets/vars que weather-refresh.yml:
#   - secret   CRON_SECRET     (idéntico al configurado en Vercel)
#   - variable ADMIN_BASE_URL  (URL de producción del panel, sin barra final)

name: Sincronizar datos en vivo

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 */6 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de sincronización"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - fixtures
          - reconcile
      dryRun:
        description: "Ejecutar en modo dryRun (no escribe cambios)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Determinar modo según el disparador
        id: vars
        run: |
          case "${{ github.event.schedule }}" in
            "*/5 * * * *") echo "mode=live" >> "$GITHUB_OUTPUT" ;;
            "0 */6 * * *") echo "mode=fixtures" >> "$GITHUB_OUTPUT" ;;
            "0 5 * * *") echo "mode=reconcile" >> "$GITHUB_OUTPUT" ;;
            *) echo "mode=${{ inputs.mode || 'live' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Invocar /api/live-sync
        env:
          # El secreto se pasa por entorno: nunca aparece en el log del comando.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.ADMIN_BASE_URL }}
          MODE: ${{ steps.vars.outputs.mode }}
          DRY_RUN: ${{ inputs.dryRun || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_URL}" ]; then
            echo "::error::Falta la variable ADMIN_BASE_URL en el repositorio."
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Falta el secreto CRON_SECRET en el repositorio."
            exit 1
          fi

          curl "${BASE_URL%/}/api/live-sync?mode=${MODE}&dryRun=${DRY_RUN}" \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 90
